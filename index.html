<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 CEZA – ÇILGIN ÇARK</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --accent-primary: #6366f1;
            --accent-secondary: #ec4899;
            --accent-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* TOP CONTROLS / STATS */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            flex-wrap: wrap;
            gap: 15px;
        }

        .current-player-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-group {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .stats-group span {
            color: var(--text-main);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        /* MAIN GAME AREA */
        .game-area {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
            width: 100%;
        }

        @media (max-width: 950px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }

        /* WHEEL SECTION */
        .wheel-container-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            min-height: 520px;
        }

        .wheel-wrapper {
            position: relative;
            width: 420px;
            height: 420px;
            max-width: 100%;
            aspect-ratio: 1;
        }

        @media (max-width: 480px) {
            .wheel-wrapper {
                width: 320px;
                height: 320px;
            }
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid var(--accent-secondary);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            z-index: 10;
        }

        .spin-btn {
            margin-top: 25px;
            background: linear-gradient(135deg, var(--accent-secondary), #d946ef);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.7);
        }

        .spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* SIDEBAR PANEL */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .panel h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* PLAYERS LIST */
        .player-input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .player-input-box input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .player-input-box input:focus {
            border-color: var(--accent-primary);
        }

        .players-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 0.9rem;
        }

        .player-item.active {
            border-color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.1);
            font-weight: 600;
        }

        .player-item button {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* HISTORY LOG */
        .history-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            padding-right: 5px;
        }

        .history-item {
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-primary);
        }

        .history-item .h-player {
            color: var(--accent-gold);
            font-weight: 600;
        }

        /* MODAL OVERLAY (PUNISHMENT REVEAL) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 12, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid var(--accent-primary);
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(99, 102, 241, 0.4);
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .tension-text {
            font-size: 1.1rem;
            color: var(--accent-secondary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: 700;
            animation: pulseText 1s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .punishment-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent-primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(99, 102, 241, 0.4);
        }

        .punishment-title {
            font-size: 2rem;
            font-weight: 900;
            color: white;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .punishment-desc {
            font-size: 1.15rem;
            color: #d1d5db;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .btn-success {
            background: #10b981;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .btn-success:hover { background: #059669; }

        .btn-pass {
            background: #6b7280;
            color: white;
        }
        .btn-pass:hover { background: #4b5563; }

        .btn-spin-again {
            background: var(--accent-primary);
            color: white;
        }
        .btn-spin-again:hover { background: #4f46e5; }

        /* SCROLLBAR CUSTOMIZATION */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <h1>100 Ceza – Çılgın Çark</h1>
            <div class="subtitle">Arkadaş ortamının en eğlenceli, güvenli ve heyecan dolu ceza meydan okuması!</div>
        </header>

        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="current-player-display" id="currentPlayerDisplay">
                Sıra: <span id="activePlayerName">Oyuncu 1</span>
            </div>
            <div class="stats-group">
                <div>Toplam Çevirme: <span id="totalSpinsCount">0</span></div>
                <div>Tamamlanan: <span id="completedCount">0</span></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" id="soundToggleBtn">Ses: Açık</button>
                <button class="btn btn-secondary" onclick="resetGameData()">Sıfırla</button>
            </div>
        </div>

        <!-- GAME AREA -->
        <div class="game-area">
            <!-- WHEEL SECTION -->
            <div class="wheel-container-card">
                <div class="wheel-wrapper">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" width="500" height="500"></canvas>
                </div>
                <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Çarkı Çevir!</button>
            </div>

            <!-- SIDEBAR -->
            <div class="sidebar">
                <!-- PLAYERS PANEL -->
                <div class="panel">
                    <h3>Oyuncular (<span id="playerCount">2</span>/10)</h3>
                    <div class="player-input-box">
                        <input type="text" id="playerNameInput" placeholder="Oyuncu Adı..." maxlength="15">
                        <button class="btn" onclick="addPlayer()">Ekle</button>
                    </div>
                    <div class="players-list" id="playersListContainer">
                        <!-- Dynamic Players -->
                    </div>
                </div>

                <!-- HISTORY PANEL -->
                <div class="panel">
                    <h3>Ceza Geçmişi</h3>
                    <div class="history-list" id="historyListContainer">
                        <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">Henüz ceza çıkmadı.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PUNISHMENT REVEAL MODAL -->
    <div class="modal-overlay" id="punishmentModal">
        <div class="modal-card">
            <div class="tension-text" id="modalTension">Gerilim Artıyor...</div>
            <div class="punishment-badge" id="modalCategory">Kategori</div>
            <div class="punishment-title" id="modalTitle">Ceza Başlığı</div>
            <div class="punishment-desc" id="modalDesc">Ceza açıklaması burada yer alacak.</div>
            <div class="modal-actions">
                <button class="modal-btn btn-success" onclick="completePunishment()">Cezayı Yaptım! ✅</button>
                <button class="modal-btn btn-spin-again" onclick="spinAgain()">Bir Daha Çevir 🔄</button>
                <button class="modal-btn btn-pass" onclick="passPunishment()">Pas Geç (Şartsız) ⏭️</button>
            </div>
        </div>
    </div>

    <script>
        // --- SOUND SYSTEM (Web Audio API) ---
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'tick') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'gong') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.8);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            } else if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        document.getElementById('soundToggleBtn').addEventListener('click', () => {

        // --- STATE MANAGEMENT ---
        let players = [
            { id: 1, name: "Oyuncu 1", completed: 0 },
            { id: 2, name: "Oyuncu 2", completed: 0 }
        ];
        let activePlayerIndex = 0;
        let totalSpins = 0;
        let completedTotal = 0;
        let historyLog = [];
        let currentSelectedPunishment = null;

        // --- CANVAS WHEEL SETUP ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSlices = punishments.length; // 100
        const arcSize = (2 * Math.PI) / numSlices;
        let currentAngle = 0;
        let isSpinning = false;

        const colors = [
            '#6366f1', '#ec4899', '#8b5cf6', '#3b82f6', 
            '#10b981', '#f59e0b', '#ef4444', '#14b8a6'
        ];

        function drawWheel(angle = 0) {
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;
            const center = radius;

            ctx.clearRect(0, 0, width, height);

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(angle);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * arcSize;
                const endAngle = (i + 1) * arcSize;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius - 10, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw Slice Number
                ctx.save();
                ctx.rotate(startAngle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px Poppins';
                ctx.fillText(`#${i + 1}`, radius - 20, 4);
                ctx.restore();
            }

            ctx.restore();

            // Center Knob
            ctx.beginPath();
            ctx.arc(center, center, 35, 0, 2 * Math.PI);
            ctx.fillStyle = '#1f2937';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#ec4899';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Poppins';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CEZA', center, center);
        }

        // --- GAME LOGIC ---
        function updateUI() {
            // Active Player
            document.getElementById('activePlayerName').textContent = players[activePlayerIndex].name;
            document.getElementById('totalSpinsCount').textContent = totalSpins;
            document.getElementById('completedCount').textContent = completedTotal;
            document.getElementById('playerCount').textContent = players.length;

            // Players List
            const pContainer = document.getElementById('playersListContainer');
            pContainer.innerHTML = '';
            players.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = `player-item ${idx === activePlayerIndex ? 'active' : ''}`;
                div.innerHTML = `
                    <span>${p.name} <small style="color:var(--text-muted)">(${p.completed} ceza)</small></span>
                    ${players.length > 2 ? `<button onclick="removePlayer(${p.id})">Sil</button>` : ''}
                `;
                pContainer.appendChild(div);
            });

            // History List
            const hContainer = document.getElementById('historyListContainer');
            if (historyLog.length === 0) {
                hContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">Henüz ceza çıkmadı.</div>`;
            } else {
                hContainer.innerHTML = '';
                historyLog.forEach(h => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `<span class="h-player">${h.player}</span>: ${h.title} <span style="color:var(--text-muted); font-size:0.75rem">(${h.status})</span>`;
                    hContainer.appendChild(item);
                });
            }
        }

        function addPlayer() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if (!name) return;
            if (players.length >= 10) {
                alert('En fazla 10 oyuncu ekleyebilirsiniz.');
                return;
            }
            players.push({ id: Date.now(), name: name, completed: 0 });
            input.value = '';
            updateUI();
        }

        function removePlayer(id) {
            if (players.length <= 2) return;
            players = players.filter(p => p.id !== id);
            if (activePlayerIndex >= players.length) activePlayerIndex = 0;
            updateUI();
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            totalSpins++;
            playSound('tick');

            // Random target slice (0 to 99)
            const winningIndex = Math.floor(Math.random() * numSlices);
            
            // Calculate target rotation angle
            const extraSpins = 6 + Math.floor(Math.random() * 4); // 6 to 9 full spins
            const sliceAngle = 2 * Math.PI / numSlices;
            // Pointer is at top (-PI/2 or 0 depending on alignment). Here pointer is at top (12 o'clock).
            // Let's align rotation so winning index is at the top.
            const targetAngle = currentAngle + (extraSpins * 2 * Math.PI) + (2 * Math.PI - (winningIndex * sliceAngle + sliceAngle / 2)) - (currentAngle % (2 * Math.PI));

            currentAngle = targetAngle;
            drawWheel(currentAngle);

            // Audio simulation ticks during spin
            let tickInterval = setInterval(() => {
                playSound('tick');
            }, 120);

            setTimeout(() => {
                clearInterval(tickInterval);
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                playSound('gong');

                // Get punishment result
                currentSelectedPunishment = punishments[winningIndex];
                showPunishmentModal(currentSelectedPunishment);
            }, 4000); // 4 seconds animation match CSS transition if any, but we draw via JS or CSS. Let's use CSS transition on canvas wrapper or direct angle redraw.
        }

        // We can hook canvas transform transition or animate via requestAnimationFrame for perfect sync
        let animationStartTime;
        let startAngleVal = 0;
        let targetAngleVal = 0;
        let animationDuration = 4000;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            totalSpins++;

            const winningIndex = Math.floor(Math.random() * numSlices);
            const sliceAngle = 2 * Math.PI / numSlices;
            
            // Target angle computation
            const fullRotations = 8 * 2 * Math.PI;
            // Top pointer corresponds to angle 0 when wheel is rotated such that slice center is at top.
            const targetSliceCenterAngle = winningIndex * sliceAngle + sliceAngle / 2;
            const desiredFinalAngle = fullRotations + (2 * Math.PI - targetSliceCenterAngle);

            startAngleVal = currentAngle;
            targetAngleVal = startAngleVal + desiredFinalAngle;
            animationStartTime = performance.now();

            requestAnimationFrame(animateWheel);
        }

        function animateWheel(currentTime) {
            const elapsed = currentTime - animationStartTime;
            const progress = Math.min(elapsed / animationDuration, 1);
            
            // Ease out cubic
            const easeProgress = 1 - Math.pow(1 - progress, 3);
            currentAngle = startAngleVal + (targetAngleVal - startAngleVal) * easeProgress;

            drawWheel(currentAngle);

            // Play tick sound on passing slices
            if (Math.floor(currentAngle * 10) % 5 === 0) {
                playSound('tick');
            }

            if (progress < 1) {
                requestAnimationFrame(animateWheel);
            } else {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                playSound('gong');

                // Determine winning index based on final angle normalized
                const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                const winningIndex = Math.floor(normalizedAngle / arcSize) % numSlices;

                currentSelectedPunishment = punishments[winningIndex];
                showPunishmentModal(currentSelectedPunishment);
            }
        }

        // --- MODAL & FLOW ---
        function showPunishmentModal(punishment) {
            const modal = document.getElementById('punishmentModal');
            document.getElementById('modalCategory').textContent = `Kategori: ${punishment.cat} (No: ${punishment.id})`;
            document.getElementById('modalTitle').textContent = punishment.title;
            document.getElementById('modalDesc').textContent = punishment.text;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('punishmentModal').classList.remove('active');
            // Next player turn
            activePlayerIndex = (activePlayerIndex + 1) % players.length;
            updateUI();
        }

        function completePunishment() {
            playSound('success');
            completedTotal++;
            players[activePlayerIndex].completed++;
            
            historyLog.unshift({
                player: players[activePlayerIndex].name,
                title: currentSelectedPunishment.title,
                status: 'Tamamlandı ✅'
            });
            if (historyLog.length > 20) historyLog.pop();

            closeModal();
        }

        function spinAgain() {
            closeModal();
            // Immediate re-spin for same player
            setTimeout(() => {
                activePlayerIndex = (activePlayerIndex - 1 + players.length) % players.length; // Revert index change
                updateUI();
                spinWheel();
            }, 300);
        }

        function passPunishment() {
            historyLog.unshift({
                player: players[activePlayerIndex].name,
                title: currentSelectedPunishment.title,
                status: 'Pas Geçildi ⏭️'
            });
            if (historyLog.length > 20) historyLog.pop();
            closeModal();
        }

        function resetGameData() {
            if (confirm('Tüm ilerleme ve istatistikler sıfırlansın mı?')) {
                totalSpins = 0;
                completedTotal = 0;
                historyLog = [];
                players.forEach(p => p.completed = 0);
                activePlayerIndex = 0;
                updateUI();
            }
        }

        // Initialize
        drawWheel();
        updateUI();
    </script>
